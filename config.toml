# rag-chatbot 系統設定檔（決策見 docs/00-main.md）
# 情境相關設定（介紹對象、聯絡方式、拒答文字、Prompt）在 profiles/*.toml（D-014）

default_profile = "intro"

[ollama]
host = "http://127.0.0.1:11434"
chat_model = "qwen2.5:3b"        # D-003；品質比較可改 qwen2.5:7b
embed_model = "bge-m3"           # D-004
timeout_seconds = 300
chat_num_ctx = 4096              # 模型的上下文長度（tokens）
chat_max_tokens = 300            # 回答最多 tokens（D-024）
chat_temperature = 0.2           # 越低越保守
keep_alive = "30m"               # 模型保持載入的時間，避免每次重新載入

[paths]                          # 相對路徑以本設定檔所在資料夾為準
db = "data/app.db"
collections = "data/collections"
profiles = "profiles"

[chunking]
chunk_size = 600                 # 字元數（D-018）
chunk_overlap = 100

[retrieval]
top_k = 5
min_score = 0.40                 # 只擋明顯無關的問題（D-022）；調整方式見 docs/03-environment.md §6
history_turns = 2                # 多輪對話時納入檢索的前文輪數
max_context_chars = 1800         # 送給 LLM 的參考資料總字數上限（D-024）

[line]                           # LINE 串接（docs/05-line.md）；金鑰放在 .env
profile = "intro"                # 使用的情境
port = 8000
reply_deadline_seconds = 50      # 超過改用 push 補送
conversation_idle_minutes = 30   # 閒置多久開始新對話
rate_limit_count = 10            # 每位訪客在 rate_limit_minutes 內最多幾題
rate_limit_minutes = 10
max_queue = 3                    # 等待中的問題上限
cloudflared_path = ""            # 空白表示自動尋找
