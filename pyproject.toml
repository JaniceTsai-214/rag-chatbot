[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chatbot"
version = "0.1.0"
description = "本機 RAG 問答機器人（Ollama）"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4",
    "numpy>=2.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "streamlit>=1.40",
    "opencc-python-reimplemented>=0.1.7",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ollama: 需要本機 Ollama 服務的整合測試（預設略過，用 pytest -m ollama 執行）",
]
addopts = "-m 'not ollama'"
